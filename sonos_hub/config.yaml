# Home-Assistant-Add-on „Sonos-Hub“ – Betriebsart ohne Sonos (Plan: docs/PLAN-sendspin.md, Teil A, §15).
# Wird von scripts/addon-sync.sh nach /addons/sonos_hub auf den HA-Host kopiert und dort gebaut.
# version setzt addon-sync.sh aus src/sonos_hub/__init__.py (Supervisor baut nur bei neuer Version neu).
name: Sonos-Hub
version: "0.3.0.239"
image: "ghcr.io/nikiwiener/{arch}-sonos-hub"
slug: sonos_hub
description: Hub für Panel und App – übersetzt Music Assistant (Sendspin) ins Hub-Protokoll
url: https://github.com/nikiwiener/sonos-hub-addon
arch:
  - amd64
  - aarch64
init: false
startup: application
# Manuell: Das Add-on startet nie von selbst, solange es erprobt wird.
boot: manual
host_network: true
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8190]/health
options:
  backends: ma
  http_port: 8190
  ma_url: ""
  ma_token: ""
  ha_url: http://127.0.0.1:8123
  ha_token: ""
  mqtt_prefix: sonos-hub
  advertise: true
  alert_url: ""
  log_level: INFO
schema:
  # Nie "sonos": Ein zweiter Hub mit Sonos-Abos neben dem Haupt-Hub ist verboten (start.py prüft das auch).
  backends: match(^(ma|sendspin)(,(ma|sendspin))?$)
  http_port: port
  ma_url: str?
  ma_token: password?
  ha_url: str?
  ha_token: password?
  mqtt_prefix: str
  advertise: bool
  alert_url: str?
  log_level: list(DEBUG|INFO|WARNING|ERROR)
